# MinIO S3 Tables Iceberg REST Catalog Benchmark Configuration
# Copy this file to application.conf to use it

http {
  base-url = "http://localhost:9001/_iceberg"
  api-prefix = "/v1"
}

auth {
  type = "sigv4"

  sigv4 {
    access-key = "minioadmin"
    secret-key = "minioadmin"
    region = "us-east-1"
    service = "s3tables"
  }
}

dataset.tree {
  skip-catalog-creation = true
  catalog-name = "testw"

  default-base-location = "s3://testw"

  namespace-width = 2
  namespace-depth = 3
  tables-per-namespace = 5
  views-per-namespace = 3

  columns-per-table = 10
  columns-per-view = 10

  namespace-properties = 5
  table-properties = 5
  view-properties = 5
}

workload {
  create-tree-dataset {
    table-concurrency = 10
    view-concurrency = 5
  }

  read-tree-dataset {
    namespace-concurrency = 10
    table-concurrency = 10
    view-concurrency = 5
  }

  read-update-tree-dataset {
    read-write-ratio = 0.5
    throughput = 50
    duration-in-minutes = 2
  }

  create-commits {
    table-commits-throughput = 5
    view-commits-throughput = 2
    duration-in-minutes = 1
  }
}
